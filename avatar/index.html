<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D Avatar & Peeker — Sakib Alam Mubin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111215">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: "Archivo";
      src: url("../assets/fonts/archivo-var-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-stretch: 62% 125%;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("../assets/fonts/jetbrains-mono-var-latin.woff2") format("woff2");
      font-weight: 400 700;
      font-display: swap;
    }

    :root {
      --ground: #111215;
      --surface: #181a20;
      --card: #1f2229;
      --line: #2b2e37;
      --ink: #ece8df;
      --ink-2: #c4c0b6;
      --ink-3: #8a867c;
      --signal: #ff5a1f;
      --signal-side: #b8380c;
      --signal-ink: #1a0d06;
      --bone: #e6e0d2;
      --bone-ink: #1a1a1c;
      --slate: #3d414a;
      --slate-side: #262930;
      --font: "Archivo", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-smooth: cubic-bezier(.22, 1, .36, 1);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: radial-gradient(75% 65% at 50% 28%, #191b22 0%, var(--ground) 76%);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Top utility bar */
    .avatar-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      max-width: 960px;
      margin-inline: auto;
      padding: 1rem 1.5rem 0;
    }

    .back-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 40px;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-2);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 700;
    }
    .back-pill:hover {
      color: var(--ink);
      border-color: var(--slate);
    }

    .sound-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      min-height: 40px;
      padding: 0.48rem 0.9rem 0.56rem;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      color: var(--ink);
      font-family: var(--font);
      font-size: 0.84rem;
      font-weight: 700;
      background: linear-gradient(180deg, #4a4f59, var(--slate) 70%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -3px 0 var(--slate-side),
        0 4px 10px -2px rgba(0,0,0,.65);
      transition: transform 80ms var(--ease-out), box-shadow 80ms;
    }
    .sound-btn:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 var(--slate-side), 0 1px 2px rgba(0,0,0,.5);
    }
    .sound-btn svg { width: 1.05rem; height: 1.05rem; }
    .sound-btn[aria-pressed="false"] .ico-on,
    .sound-btn[aria-pressed="true"] .ico-off { display: none; }

    /* Top Stage Container */
    .hero-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 82vh;
      padding: 1.5rem 1.5rem 2rem;
      text-align: center;
    }

    .title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      font-size: 1rem;
      color: var(--ink-3);
      margin-bottom: 2rem;
      max-width: 44ch;
    }

    /* ---------- Avatar Stage Styles ---------- */
    .avatar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 520px;
    }

    .avatar-stage {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1.08 / 1;
      border-radius: 28px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 55%, rgba(255, 90, 31, 0.08) 0%, transparent 68%),
                  linear-gradient(180deg, #1f2229 0%, #15171d 100%);
      border: 1px solid var(--line);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 24px 44px -14px rgba(0, 0, 0, 0.72);
      display: grid;
      place-items: center;
      user-select: none;
      touch-action: pan-y;
    }

    .avatar-wave {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .avatar-hit {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .avatar-mount {
      display: block;
      width: min(84%, 350px);
      pointer-events: none;
    }

    .av-svg { width: 100%; height: auto; overflow: visible; }
    .av-head, .av-face, .av-hair-front, .av-body, .av-root {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }

    /* Avatar Facial Expressions */
    .av-eyes-happy,
    .av-eyes-dizzy,
    .av-mouth-laugh,
    .av-arm-wave,
    .av-sparks {
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms var(--ease-out);
    }

    .av-shades {
      opacity: 0;
      transform: translateY(-14px);
      pointer-events: none;
      transition: opacity 180ms var(--ease-out), transform 240ms var(--ease-out);
    }

    .avatar-stage.has-shades .av-shades {
      opacity: 1;
      transform: translateY(0);
    }

    .avatar-stage.is-blinking .av-eyes-open,
    .avatar-stage.is-happy .av-eyes-open,
    .avatar-stage.is-dizzy .av-eyes-open { opacity: 0; }

    .avatar-stage.is-blinking .av-eyes-happy,
    .avatar-stage.is-happy .av-eyes-happy { opacity: 1; }

    .avatar-stage.is-happy .av-mouth-calm { opacity: 0; }
    .avatar-stage.is-happy .av-mouth-laugh,
    .avatar-stage.is-happy .av-sparks { opacity: 1; }

    .avatar-stage.is-dizzy .av-eyes-dizzy { opacity: 1; }

    .avatar-stage.is-waving .av-arm-rest-r { opacity: 0; }
    .avatar-stage.is-waving .av-arm-wave {
      opacity: 1;
      transform-origin: 202px 176px;
      animation: av-wave 0.34s ease-in-out infinite alternate;
    }

    @keyframes av-wave {
      from { transform: rotate(-7deg); }
      to { transform: rotate(9deg); }
    }

    /* Speech Badge */
    .avatar-badge {
      position: absolute;
      top: 1rem;
      left: 50%;
      z-index: 4;
      transform: translate(-50%, -6px);
      opacity: 0;
      pointer-events: none;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      background: var(--bone);
      color: var(--bone-ink);
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      box-shadow: 0 8px 18px -4px rgba(0, 0, 0, 0.65);
      transition: opacity 160ms var(--ease-out), transform 180ms var(--ease-out);
    }
    .avatar-badge.is-on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Avatar Control Dock */
    .avatar-dock {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.25rem;
    }

    .dock-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 1rem 0.65rem;
      border-radius: 11px;
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 650;
      color: var(--ink);
      background: linear-gradient(180deg, #3c404b, var(--slate) 70%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -3px 0 var(--slate-side),
        0 4px 10px -2px rgba(0, 0, 0, 0.6);
      transition: transform 70ms var(--ease-out), box-shadow 70ms;
      -webkit-tap-highlight-color: transparent;
    }
    .dock-btn:active, .dock-btn.is-down {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 var(--slate-side),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .dock-btn svg { width: 1.05rem; height: 1.05rem; }
    .dock-btn[aria-pressed="true"] {
      background: linear-gradient(180deg, #ff7b47, var(--signal) 70%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.26),
        inset 0 -3px 0 var(--signal-side),
        0 4px 12px -2px rgba(0, 0, 0, 0.55);
      color: var(--signal-ink);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* Middle Scroll Area */
    .scroll-guide {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 10rem 1.5rem;
      color: var(--ink-3);
      text-align: center;
    }
    .scroll-arrow {
      animation: pulse-arrow 2.2s var(--ease-smooth) infinite;
    }
    @keyframes pulse-arrow {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(8px); opacity: 1; }
    }

    /* ---------- Bottom Footer + Upside-Down Peeker ---------- */
    .site-footer {
      position: relative;
      background: #0d0e12;
      border-top: 1px solid var(--line);
      padding: 0 0 5rem;
      min-height: 380px;
    }

    .footer-seam {
      position: relative;
      width: 100%;
      height: 144px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .footer-seam-wave {
      position: absolute;
      top: -1px;
      left: 0;
      width: 100%;
      height: 78px;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 7px 9px rgba(6, 7, 10, 0.65));
    }

    .peeker {
      position: absolute;
      left: 50%;
      top: 0;
      translate: -50% 0;
      z-index: 2;
      width: 160px;
      height: 140px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .peeker-art {
      display: block;
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    .peeker-svg { width: 100%; height: auto; overflow: visible; }
    .peeker .pk-eyes-laugh { opacity: 0; transition: opacity 140ms var(--ease-out); }
    .peeker.is-peeking .pk-eyes-calm { opacity: 0; }
    .peeker.is-peeking .pk-eyes-laugh { opacity: 1; }

    .peeker-note {
      position: absolute;
      left: calc(50% + 86px);
      top: 56px;
      z-index: 4;
      padding: 0.42rem 0.9rem;
      border-radius: 999px;
      background: var(--bone);
      color: var(--bone-ink);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      box-shadow: 0 8px 18px -4px rgba(0, 0, 0, 0.65);
      transition: opacity 180ms var(--ease-out), transform 220ms var(--ease-out);
    }
    .peeker-note.is-on { opacity: 1; transform: translateY(0); }

    .footer-content {
      text-align: center;
      color: var(--ink-3);
      font-size: 0.92rem;
      padding-inline: 1.5rem;
    }

    @media (max-width: 640px) {
      .avatar-topbar {
        padding: 0.85rem 1rem 0;
      }
      .peeker-note {
        left: 50%;
        top: 96px;
        translate: -50% 0;
        max-width: calc(100% - 1.5rem);
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="avatar-topbar">
    <a class="back-pill" href="/">← Portfolio</a>
    <button class="sound-btn" type="button" id="soundToggle" aria-pressed="true" aria-label="Mute sound">
      <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5L6 9H3v6h3l5 4V5z"/>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
        <path d="M18.8 5.8a9 9 0 0 1 0 12.4"/>
      </svg>
      <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5L6 9H3v6h3l5 4V5z"/>
        <path d="M22 9l-6 6"/>
        <path d="M16 9l6 6"/>
      </svg>
      <span>Audio</span>
    </button>
  </header>

  <!-- Top Hero Stage -->
  <section class="hero-stage">
    <h1 class="title">Interactive 3D Avatar</h1>
    <p class="subtitle">Move your mouse to look around · Spin around head to make him dizzy · Click buttons or face</p>

    <div class="avatar-col">
      <div class="avatar-stage" data-avatar>
        <canvas class="avatar-wave"></canvas>
        <button class="avatar-hit" type="button" data-avatar-hit aria-label="Boop SA Mubin avatar">
          <span class="avatar-mount" data-avatar-mount></span>
        </button>
        <span class="avatar-badge" data-avatar-badge role="status" aria-live="polite"></span>
      </div>

      <div class="avatar-dock">
        <button class="dock-btn" type="button" data-avatar-act="boop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          Boop
        </button>
        <button class="dock-btn" type="button" data-avatar-act="shades" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="4"/><circle cx="18" cy="12" r="4"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
          Shades
        </button>
        <button class="dock-btn" type="button" data-avatar-act="wave">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v4"/><path d="M14 10V4a2 2 0 0 0-4 0v7"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 0 1 4 4 7 7 0 0 1-7 7H9a7 7 0 0 1-7-7V9a2 2 0 0 1 4 0v3"/></svg>
          Say Hi
        </button>
      </div>
    </div>
  </section>

  <!-- Middle Scroll Guide -->
  <div class="scroll-guide">
    <div style="font-weight: 700; letter-spacing: -0.01em; color: var(--ink-2); font-size: 1.15rem;">
      Scroll down to see the footer peeker avatar
    </div>
    <div class="scroll-arrow">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <polyline points="19 12 12 19 5 12"></polyline>
      </svg>
    </div>
  </div>

  <!-- Footer with Upside-Down Peeker -->
  <footer class="site-footer">
    <div class="footer-seam">
      <svg class="footer-seam-wave" viewBox="0 0 1440 84" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#e6e0d2" d="M0,0 L1440,0 L1440,56 C1210,72 980,68 855,34 C795,18 758,10 720,10 C682,10 645,18 585,34 C460,68 230,72 0,56 Z"/>
      </svg>
      <button class="peeker" type="button" data-peeker aria-label="Peek at upside-down SA Mubin">
        <span class="peeker-art" data-peeker-art></span>
      </button>
      <span class="peeker-note" data-peeker-note role="status" aria-live="polite"></span>
    </div>

    <div class="footer-content">
      <p>Upside-Down Footer Peeker · Hover or click to&nbsp;reveal</p>
    </div>
  </footer>

  <script>
    (() => {
      /* ---------- Web Audio Synthesizer (Zero External Files) ---------- */
      let audioCtx = null;
      let soundEnabled = true;

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function tone({ freq = 440, to = null, dur = 0.08, gain = 0.2, type = "sine", when = 0 }) {
        if (!soundEnabled) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        const t = ctx.currentTime + when;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(ctx.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      }

      const sounds = {
        boop() {
          tone({ freq: 330, to: 760, dur: 0.095, gain: 0.22, type: "sine" });
          tone({ freq: 988, to: 1318, dur: 0.08, gain: 0.11, type: "triangle", when: 0.055 });
        },
        shades() {
          [329.63, 415.3, 493.88, 659.25].forEach((f, i) =>
            tone({ freq: f, dur: 0.15, gain: 0.11, type: "triangle", when: i * 0.042 })
          );
        },
        wave() {
          tone({ freq: 523.25, to: 659.25, dur: 0.085, gain: 0.15, type: "sine" });
          tone({ freq: 659.25, to: 880, dur: 0.11, gain: 0.14, type: "sine", when: 0.085 });
        },
        click() {
          tone({ freq: 620, to: 280, dur: 0.024, gain: 0.08, type: "triangle" });
        },
        boing() {
          tone({ freq: 190, to: 520, dur: 0.11, gain: 0.18, type: "sine" });
          tone({ freq: 340, to: 640, dur: 0.13, gain: 0.13, type: "triangle", when: 0.08 });
        }
      };

      const soundToggle = document.getElementById("soundToggle");
      soundToggle.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundToggle.setAttribute("aria-pressed", String(soundEnabled));
        soundToggle.setAttribute("aria-label", soundEnabled ? "Mute sound" : "Turn sound on");
        if (soundEnabled) sounds.click();
      });

      /* ---------- 1. Primary Avatar SVG ---------- */
      function avatarSvg(p) {
        return '<' + 'svg class="av-svg" viewBox="0 0 320 310" aria-hidden="true">' + `
  <defs>
    <radialGradient id="${p}-skin" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#f7d5b9"/>
      <stop offset="56%" stop-color="#e2aa82"/>
      <stop offset="100%" stop-color="#b97850"/>
    </radialGradient>
    <radialGradient id="${p}-ear" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#eab58e"/>
      <stop offset="100%" stop-color="#b5724b"/>
    </radialGradient>
    <radialGradient id="${p}-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5e4d" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#ff5e4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="${p}-hair" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#353038"/>
      <stop offset="48%" stop-color="#1e1b21"/>
      <stop offset="100%" stop-color="#110f14"/>
    </linearGradient>
    <linearGradient id="${p}-hair-hi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#524a56"/>
      <stop offset="60%" stop-color="#26222a"/>
      <stop offset="100%" stop-color="#151318"/>
    </linearGradient>
    <radialGradient id="${p}-hood" cx="36%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#ff8a57"/>
      <stop offset="52%" stop-color="#ff5a1f"/>
      <stop offset="100%" stop-color="#a83208"/>
    </radialGradient>
    <linearGradient id="${p}-chest" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f8f4ec"/>
      <stop offset="65%" stop-color="#e5dfd0"/>
      <stop offset="100%" stop-color="#beb6a2"/>
    </linearGradient>
    <linearGradient id="${p}-pants" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#343943"/>
      <stop offset="55%" stop-color="#20232a"/>
      <stop offset="100%" stop-color="#13151a"/>
    </linearGradient>
    <linearGradient id="${p}-shoe" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="70%" stop-color="#ded8c8"/>
      <stop offset="100%" stop-color="#b4ad9b"/>

      /* ---------- 3. Radial Capsule-Dash Wave Canvas ---------- */
      const WAVE_STOPS = [
        [255, 90, 31],   // safety orange
        [251, 146, 60],  // amber
        [168, 85, 247],  // orchid
        [56, 189, 248],  // sky
      ];

      function sampleWaveColor(t) {
        const clamped = Math.max(0, Math.min(1, t));
        const scaled = clamped * (WAVE_STOPS.length - 1);
        const idx = Math.min(WAVE_STOPS.length - 2, Math.floor(scaled));
        const f = scaled - idx;
        const a = WAVE_STOPS[idx];
        const b = WAVE_STOPS[idx + 1];
        return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)})`;
      }

      function initWaveCanvas(canvas, stage) {
        const ctx = canvas.getContext("2d");
        let w = 0, h = 0, dpr = 1;
        let targetFx = 0.22, targetFy = 0.62, fx = 0.22, fy = 0.62;
        let phase = 0, ripple = 0, rippleRadius = 0;

        function resize() {
          const r = stage.getBoundingClientRect();
          w = Math.max(260, r.width);
          h = Math.max(240, r.height);
          dpr = Math.min(2, window.devicePixelRatio || 1);
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function drawFrame() {
          ctx.clearRect(0, 0, w, h);
          const ox = fx * w, oy = fy * h;
          const maxDist = Math.hypot(w, h) * 1.05;
          const rays = w < 460 ? 20 : 26;
          ctx.lineCap = "round";

          for (let i = 0; i < rays; i++) {
            const baseAngle = (i / rays) * Math.PI * 2;
            const nx = -Math.sin(baseAngle), ny = Math.cos(baseAngle);
            const dx = Math.cos(baseAngle), dy = Math.sin(baseAngle);

            let dist = 28 + (i % 3) * 10;
            let segIdx = 0;
            while (dist < maxDist) {
              const segLen = 15 + (segIdx % 3) * 6;
              const gap = 12 + ((i + segIdx) % 2) * 4;
              const tNorm = Math.min(1, dist / (maxDist * 0.72));
              const shock = ripple > 0.01 ? Math.exp(-Math.pow((dist - rippleRadius) / 44, 2)) * ripple * 16 : 0;
              const wave1 = Math.sin(dist * 0.034 - phase + i * 0.3) * (5 + tNorm * 11) + shock;
              const wave2 = Math.sin((dist + segLen) * 0.034 - phase + i * 0.3) * (5 + tNorm * 11) + shock;

              const x1 = ox + dx * dist + nx * wave1;
              const y1 = oy + dy * dist + ny * wave1;
              const x2 = ox + dx * (dist + segLen) + nx * wave2;
              const y2 = oy + dy * (dist + segLen) + ny * wave2;

              if (x2 > -24 && x1 < w + 24 && y2 > -24 && y1 < h + 24) {
                ctx.strokeStyle = sampleWaveColor(tNorm * 0.86 + (i / rays) * 0.14);
                ctx.globalAlpha = 0.36 + (1 - tNorm) * 0.48;
                ctx.lineWidth = w < 460 ? 5.5 : 7.0;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
              }
              dist += segLen + gap;
              segIdx++;
            }
          }
          ctx.globalAlpha = 1;
        }

        function tick() {
          fx += (targetFx - fx) * 0.075;
          fy += (targetFy - fy) * 0.075;
          phase += 0.032;
          if (ripple > 0.005) {
            rippleRadius += 9.5;
            ripple *= 0.94;
          } else {
            ripple = 0;
          }
          drawFrame();
          requestAnimationFrame(tick);
        }

        addEventListener("resize", resize, { passive: true });
        resize();
        requestAnimationFrame(tick);

        return {
          pulse(originX = 0.5, originY = 0.5) {
            targetFx = originX;
            targetFy = originY;
            ripple = 1;
            rippleRadius = 18;
          },
          setFocus(nx, ny) {
            targetFx = Math.max(0.08, Math.min(0.92, nx));
            targetFy = Math.max(0.12, Math.min(0.88, ny));
          }
        };
      }

      /* ---------- 4. Setup Hero Avatar Interaction ---------- */
      const stage = document.querySelector("[data-avatar]");
      const mount = stage.querySelector("[data-avatar-mount]");
      mount.innerHTML = avatarSvg("demo_av");

      const canvas = stage.querySelector("canvas");
      const wave = initWaveCanvas(canvas, stage);
      const root = stage.querySelector(".av-root");
      const head = stage.querySelector(".av-head");
      const face = stage.querySelector(".av-face");
      const hairFront = stage.querySelector(".av-hair-front");
      const body = stage.querySelector(".av-body");
      const pupils = [...stage.querySelectorAll(".av-pupil")];
      const mouthCalm = stage.querySelector(".av-mouth-calm");
      const badge = stage.querySelector("[data-avatar-badge]");
      const hitBtn = stage.querySelector("[data-avatar-hit]");

      let tx = 0, ty = 0, cx = 0, cy = 0, hopY = 0, hopV = 0;
      let happyTimer = 0, waveTimer = 0, dizzyTimer = 0;
      let lastAngle = null, spinAccum = 0;
      const LINES = [
        "Hey! Welcome to my studio.",
        "Boop registered at 60fps!",
        "Clay-shaded vector SVG art!",
        "Try waving or putting on shades!",
        "Zero 3D frameworks used!"
      ];
      let lineIdx = 0;

      function showBadge(text) {
        badge.textContent = text;
        badge.classList.add("is-on");
        clearTimeout(badge._t);
        badge._t = setTimeout(() => badge.classList.remove("is-on"), 2400);
      }

      function step() {
        cx += (tx - cx) * 0.14;
        cy += (ty - cy) * 0.14;
        hopV = (hopV - hopY * 0.18) * 0.82;
        hopY += hopV;

        if (root) root.style.transform = `translate3d(0, ${hopY.toFixed(2)}px, 0)`;
        if (head) head.style.transform = `translate3d(${(cx * 9).toFixed(2)}px, ${(cy * 6.5).toFixed(2)}px, 0) rotate(${(cx * 5.2).toFixed(2)}deg)`;
        if (face) face.style.transform = `translate3d(${(cx * 5.5).toFixed(2)}px, ${(cy * 4.5).toFixed(2)}px, 0)`;
        if (hairFront) hairFront.style.transform = `translate3d(${(cx * 2.5).toFixed(2)}px, ${(cy * 2).toFixed(2)}px, 0)`;
        if (body) body.style.transform = `translate3d(${(cx * 3).toFixed(2)}px, ${(cy * 1.8).toFixed(2)}px, 0)`;

        pupils.forEach((p) => {
          p.setAttribute("cx", (-1.6 + cx * 3.1).toFixed(2));
          p.setAttribute("cy", (-2.0 + cy * 2.8).toFixed(2));
        });

        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);

      function boop() {
        sounds.boop();
        stage.classList.remove("is-dizzy");
        stage.classList.add("is-happy");
        clearTimeout(happyTimer);
        happyTimer = setTimeout(() => stage.classList.remove("is-happy"), 1150);
        hopV = -9.5;
        wave.pulse(0.5, 0.48);
        showBadge(LINES[lineIdx++ % LINES.length]);
      }

      function toggleShades() {
        const on = !stage.classList.contains("has-shades");
        stage.classList.toggle("has-shades", on);
        document.querySelectorAll('[data-avatar-act="shades"]').forEach(b => b.setAttribute("aria-pressed", String(on)));
        sounds[on ? "shades" : "click"]();
        hopV = -5.2;
        showBadge(on ? "Ship mode: shades on." : "Back to bright eyes.");
      }

      function triggerWave() {
        stage.classList.add("is-waving", "is-happy");
        sounds.wave();
        hopV = -6.5;
        wave.pulse(0.68, 0.42);
        showBadge("Hi! I'm SA Mubin.");
        clearTimeout(waveTimer);
        waveTimer = setTimeout(() => stage.classList.remove("is-waving", "is-happy"), 1850);
      }

      hitBtn.addEventListener("click", boop);

      document.querySelectorAll("[data-avatar-act]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const act = btn.dataset.avatarAct;
          if (act === "boop") boop();
          else if (act === "shades") toggleShades();
          else if (act === "wave") triggerWave();
        });
      });

      // Pointer tracking
      addEventListener("pointermove", (e) => {
        if (e.pointerType === "touch") return;
        const r = stage.getBoundingClientRect();
        const centerX = r.left + r.width * 0.5;
        const centerY = r.top + r.height * 0.44;
        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        tx = Math.max(-1, Math.min(1, dx / 280));
        ty = Math.max(-1, Math.min(1, dy / 240));

        const dist = Math.hypot(dx, dy);
        if (mouthCalm) {
          const smileDepth = dist < 240 ? 143 + (1 - dist / 240) * 4.5 : 143;
          mouthCalm.setAttribute("d", `M152 136 Q160 ${smileDepth.toFixed(1)} 168 136`);
        }

        if (dist < 520) {
          const nx = (e.clientX - r.left) / Math.max(1, r.width);
          const ny = (e.clientY - r.top) / Math.max(1, r.height);
          wave.setFocus(nx * 0.65 + 0.1, ny * 0.65 + 0.15);
        }

        // Circular dizzy spin
        if (dist > 28 && dist < 240 && !stage.classList.contains("is-dizzy")) {
          const ang = Math.atan2(dy, dx);
          if (lastAngle !== null) {
            let delta = ang - lastAngle;
            if (delta > Math.PI) delta -= Math.PI * 2;
            if (delta < -Math.PI) delta += Math.PI * 2;
            spinAccum = spinAccum * 0.96 + Math.abs(delta);
            if (spinAccum > 13.5) {
              spinAccum = 0;
              stage.classList.add("is-dizzy");
              sounds.boing();
              hopV = -8;
              showBadge("Whoa! 60fps spin cycle!", 2400);
              clearTimeout(dizzyTimer);
              dizzyTimer = setTimeout(() => stage.classList.remove("is-dizzy"), 2300);
            }
          }
          lastAngle = ang;
        }
      }, { passive: true });

      // Natural idle blinking
      const scheduleBlink = () => {
        setTimeout(() => {
          if (!stage.classList.contains("is-happy") && !stage.classList.contains("is-dizzy") && !stage.classList.contains("has-shades")) {
            stage.classList.add("is-blinking");
            setTimeout(() => stage.classList.remove("is-blinking"), 150);
          }
          scheduleBlink();
        }, 2800 + Math.random() * 2800);
      };
      scheduleBlink();

      /* ---------- 5. Setup Footer Peeker Interaction ---------- */
      const peekerBtn = document.querySelector("[data-peeker]");
      const peekerArt = peekerBtn.querySelector("[data-peeker-art]");
      peekerArt.innerHTML = peekerSvg("demo_pk");

      const peekerNote = document.querySelector("[data-peeker-note]");
      const peekerPupils = [...peekerBtn.querySelectorAll(".pk-pupil")];
      const REST_Y = -41, OPEN_Y = -4;
      let pkY = REST_Y, pkTargetY = REST_Y, pkVy = 0, pkPinned = false;
      const PEEK_MSGS = [
        "Thanks for scrolling all the way down!",
        "Caught me hanging upside down!",
        "Zero external frameworks used!",
        "Pure CSS & SVG vector craft!"
      ];
      let pkMsgIdx = 0;

      function renderPeeker() {
        pkVy = (pkVy + (pkTargetY - pkY) * 0.16) * 0.78;
        pkY += pkVy;
        peekerArt.style.transform = `translate3d(0, ${pkY.toFixed(2)}px, 0)`;
        requestAnimationFrame(renderPeeker);
      }
      peekerArt.style.transform = `translate3d(0, ${REST_Y}px, 0)`;
      requestAnimationFrame(renderPeeker);

      function setPeekerOpen(open, fromClick = false) {
        peekerBtn.classList.toggle("is-peeking", open);
        pkTargetY = open ? OPEN_Y : REST_Y;
        if (fromClick) pkVy += 5.5;
      }

      peekerBtn.addEventListener("pointerenter", () => { if (!pkPinned) setPeekerOpen(true); });
      peekerBtn.addEventListener("pointerleave", () => { if (!pkPinned) setPeekerOpen(false); });
      peekerBtn.addEventListener("click", () => {
        pkPinned = !pkPinned || !peekerBtn.classList.contains("is-peeking");
        setPeekerOpen(pkPinned, true);
        if (pkPinned) {
          sounds.wave();
          peekerNote.textContent = PEEK_MSGS[pkMsgIdx++ % PEEK_MSGS.length];
          peekerNote.classList.add("is-on");
          clearTimeout(peekerNote._t);
          peekerNote._t = setTimeout(() => peekerNote.classList.remove("is-on"), 3200);
        } else {
          sounds.click();
          peekerNote.classList.remove("is-on");
        }
      });

      addEventListener("pointermove", (e) => {
        if (e.pointerType === "touch") return;
        const r = peekerBtn.getBoundingClientRect();
        if (r.top > innerHeight + 60 || r.bottom < -60) return;
        const dx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / 220));
        const dy = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / 180));
        peekerPupils.forEach((p) => {
          p.setAttribute("cx", (-dx * 2.8).toFixed(2));
          p.setAttribute("cy", (-dy * 2.4).toFixed(2));
        });
      }, { passive: true });

    })();
  </script>
</body>
</html>
